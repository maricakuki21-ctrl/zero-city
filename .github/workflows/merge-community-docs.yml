name: Merge verified community documentation
on:
  workflow_run:
    workflows: [Contribution checks]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: community-documentation-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Do not checkout or execute any PR code in this privileged workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            for (const link of run.pull_requests || []) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: link.number});
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== link.head.sha || pr.base.sha !== link.base.sha) continue;
              if (pr.mergeable_state !== 'clean') continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: pr.number, per_page: 100});
              if (!files.length || files.length !== pr.changed_files || files.length > 20) continue;
              const safe = files.every(f => /^docs\/community\/[a-zA-Z0-9_-]+\.md$/.test(f.filename)
                && ['added','modified'].includes(f.status) && f.changes <= 600);
              if (!safe) continue;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {...context.repo, pull_number: pr.number, per_page: 100});
              const latest = new Map();
              for (const review of reviews) if (['APPROVED','CHANGES_REQUESTED','DISMISSED'].includes(review.state)) latest.set(review.user.id, review.state);
              if ([...latest.values()].includes('CHANGES_REQUESTED')) continue;
              const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              if (branch.data.commit.sha !== pr.base.sha) continue;
              await github.rest.pulls.merge({...context.repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'squash'});
              core.info(`Merged documentation PR #${pr.number}`);
            }
