name: zero-city-demo
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    ports: ["127.0.0.1:18081:8080"]
    environment:
      AUTO_SETUP: 'true'
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USER: city
      DATABASE_PASSWORD: ${DEMO_DB_PASSWORD:?set a demo database password}
      DATABASE_DBNAME: city_demo
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set a demo admin password}
      JWT_SECRET: ${DEMO_JWT_SECRET:?set a demo JWT secret}
    volumes: ["app_data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?set a demo database password}
      POSTGRES_DB: city_demo
    volumes: ["pg_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city -d city_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  pg_data:
  app_data:
